{% extends "base.html" %}

{% block title %}{{ taxonomy.name | title }} - {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ taxonomy.name | title }}</h1>
<ul class="taxonomy-list">
  {% for term in terms %}
  <li>
    <a href="{{ term.permalink }}">{{ term.name }}</a>
    <span class="count">({{ term.pages | length }})</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
